<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paediatric Drug Calculator</title>
<style>
:root{
  --bg:#eef2f7;--bg-accent:#e4ebf5;--panel:#fff;--panel-2:#f8fafc;
  --border:#d9e2ec;--border-strong:#c4d0dd;--text:#12202f;--muted:#5b6b7c;
  --primary:#0f172a;--primary-2:#1d4ed8;--primary-soft:#dbeafe;
  --danger:#b91c1c;--danger-soft:#fee2e2;--warn:#f59e0b;--warn-soft:#fef3c7;
  --ok:#059669;--ok-soft:#d1fae5;
  --shadow:0 12px 36px rgba(15,23,42,.08);--shadow-soft:0 8px 24px rgba(15,23,42,.06);
  --ui-font:Inter,Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;padding:0;min-height:100vh;background:radial-gradient(circle at top left,#f8fbff 0%,var(--bg) 42%,var(--bg-accent) 100%);color:var(--text);font-family:var(--ui-font);font-size:15px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{padding:20px}
.container{max-width:1180px;margin:0 auto}

.header{background:linear-gradient(135deg,#fff 0%,#f6f9fc 100%);border:1px solid var(--border);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow-soft);margin-bottom:16px;transition:background .35s,border-color .35s}
.header-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.header h1{font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--primary);margin:0;transition:color .35s}
.header h1 span{margin-right:6px}
.brand-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--primary-2);background:var(--primary-soft);border:1px solid #bfdbfe;padding:7px 12px;border-radius:999px;margin-bottom:10px;transition:background .35s,border-color .35s,color .35s}
.header-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hdr-input{width:76px;padding:10px 12px;border:1px solid var(--border-strong);border-radius:12px;font-size:15px;font-family:var(--ui-font);background:#fff;color:var(--text);outline:none;text-align:center;transition:border-color .18s,box-shadow .18s,background .25s,color .25s}
.hdr-input::placeholder{color:#94a3b8}
.hdr-input:focus{border-color:#60a5fa;box-shadow:0 0 0 4px rgba(96,165,250,.16);background:#fff}
.hdr-label{font-size:13px;font-weight:800;color:#334155;letter-spacing:.01em;margin-right:2px;transition:color .35s}
.hdr-select{padding:10px 12px;border:1px solid var(--border-strong);border-radius:12px;font-size:15px;font-family:var(--ui-font);background:#fff;color:var(--text);outline:none;cursor:pointer;transition:border-color .18s,box-shadow .18s,background .25s,color .25s}
.hdr-select:focus{border-color:#60a5fa;box-shadow:0 0 0 4px rgba(96,165,250,.16)}
.hdr-select option{color:#333}
.dark-toggle{appearance:none;border:1px solid var(--border);background:rgba(255,255,255,.7);border-radius:10px;padding:8px 12px;font-size:16px;cursor:pointer;transition:.25s ease;font-family:var(--ui-font);display:inline-flex;align-items:center;gap:4px;line-height:1}
.dark-toggle:hover{transform:scale(1.08)}

.info-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.chip{background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:background .35s,border-color .35s,color .35s}
.chip.age{color:#6c5ce7}
.chip.pct{color:#e17055}
.chip.temp{color:#d63031}
.chip.wt{color:#00b894}

.tabs{display:flex;gap:5px;margin-bottom:0;flex-wrap:wrap}
.tab{padding:11px 18px;border-radius:12px 12px 0 0;cursor:pointer;font-size:14px;font-weight:800;background:var(--panel-2);color:var(--muted);transition:all .18s;border:1px solid var(--border);border-bottom:none;font-family:var(--ui-font)}
.tab:hover{transform:translateY(-1px);border-color:#94a3b8;color:var(--text)}
.tab.active{background:var(--panel);color:var(--text);border-color:var(--border-strong);box-shadow:0 -4px 12px rgba(15,23,42,.04)}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:0 18px 18px 18px;padding:22px;box-shadow:var(--shadow-soft);margin-bottom:16px;min-height:200px;transition:background .35s,border-color .35s;overflow-x:auto}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search-input{min-width:220px;flex:1;padding:11px 14px;border:1px solid var(--border-strong);border-radius:12px;font-size:15px;font-family:var(--ui-font);background:#fff;color:var(--text);outline:none}
.search-input:focus{border-color:#60a5fa;box-shadow:0 0 0 4px rgba(96,165,250,.16)}
.toolbar-note{font-size:12px;color:var(--muted);font-weight:700}

.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--border);background:var(--panel-2);color:var(--text);
  border-radius:12px;padding:10px 13px;font-size:14px;font-weight:900;
}
.icon-btn.active{background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;border-color:#2563eb}

.dtable{width:100%;border-collapse:collapse}
.dtable th{text-align:left;font-size:12px;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:2px solid var(--bg);letter-spacing:.06em;font-weight:800}
.dtable td{padding:12px;border-bottom:1px solid var(--bg);vertical-align:top;font-size:15px}
.dtable tr:hover{background:var(--panel-2)}
.drug-name{font-weight:800;font-size:15px;color:var(--text)}
.drug-note{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.35}
.form-select{padding:8px 12px;border:1px solid var(--border-strong);border-radius:10px;font-size:14px;font-family:var(--ui-font);background:#fff;cursor:pointer;max-width:260px;color:var(--text);outline:none;transition:border-color .18s,box-shadow .18s}
.form-select:focus{border-color:#60a5fa;box-shadow:0 0 0 4px rgba(96,165,250,.16)}
.dose-val{font-weight:800;color:var(--primary-2);font-size:15px;white-space:nowrap}
.vol-val{font-weight:800;color:#d63031;font-size:15px;white-space:nowrap}
.freq-val{color:var(--muted);font-size:14px;white-space:nowrap;font-weight:600}
.capped{background:#fef9e7}
.max-badge{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;font-size:11px;padding:3px 7px;border-radius:6px;font-weight:700;margin-left:6px}
.age-warn{background:linear-gradient(135deg,#fee2e2,#fef2f2)!important}
.age-warn:hover{background:linear-gradient(135deg,#fecaca,#fee2e2)!important}
.age-badge{display:inline-flex;align-items:center;gap:3px;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-size:10px;padding:3px 8px;border-radius:6px;font-weight:800;margin-left:6px;letter-spacing:.02em;text-transform:uppercase}
.warn-line{color:var(--danger);font-weight:900;font-size:12px;margin-top:4px;white-space:normal;line-height:1.35}
.ok-line{color:var(--ok);font-weight:900;font-size:12px;margin-top:4px;white-space:normal;line-height:1.35}
.range-line{color:var(--primary-2);font-weight:900;font-size:12px;margin-top:4px;white-space:normal;line-height:1.35}

.pcm-box{background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid #fbbf24;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 4px 12px rgba(251,191,36,.12)}
.pcm-title{font-weight:800;font-size:16px;margin-bottom:12px;color:var(--primary)}
.pcm-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pcm-option{background:#fff;border-radius:14px;padding:16px 18px;border:2px solid var(--border);position:relative;transition:border-color .2s,background .2s}
.pcm-option.winner{border-color:#10b981;background:linear-gradient(135deg,#ecfdf5,#d1fae5)}
.pcm-option .badge{position:absolute;top:-9px;right:12px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-size:11px;padding:3px 10px;border-radius:999px;font-weight:800;letter-spacing:.02em}
.pcm-option h4{font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.pcm-option .big{font-size:17px;font-weight:800;color:var(--text)}
.pcm-option .sub{font-size:14px;color:var(--muted);margin-top:4px;font-weight:600}
.pcm-form{margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pcm-form label{font-size:14px;font-weight:800;color:#334155}

.chart-wrap{display:grid;grid-template-columns:1fr;gap:14px}
.chart-card{background:var(--panel-2);border:1px solid var(--border);border-radius:16px;padding:16px}
.chart-box{width:100%;height:440px;position:relative}
.chart-box svg{width:100%;height:100%;display:block}
.chart-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.legend-item{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted)}
.legend-line{width:18px;height:3px;border-radius:999px}
.result-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;color:var(--text);line-height:1.5}

.date-kind-box{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel-2);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:14px}
.date-kind-box .hint{color:var(--muted);font-size:13px;font-weight:700}
.result-big{font-size:22px;font-weight:900;color:var(--primary-2);margin:6px 0}
.result-small{font-size:13px;color:var(--muted);font-weight:700;line-height:1.6}

.disc{background:linear-gradient(135deg,#fff 0%,#f6f9fc 100%);border:1px solid var(--border);border-radius:14px;padding:16px 20px;font-size:13px;color:var(--muted);margin-top:16px;box-shadow:var(--shadow-soft);transition:background .35s,border-color .35s,color .35s;line-height:1.5}

button{border:0;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:800;cursor:pointer;font-family:var(--ui-font);transition:transform .16s,box-shadow .16s,opacity .16s,background .16s}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(0)}
.btn-clear{background:#eef2f7;color:var(--text);border:1px solid var(--border);box-shadow:0 4px 10px rgba(15,23,42,.04);font-size:14px;padding:10px 16px;transition:background .25s,border-color .25s,color .25s}
.btn-clear:hover{background:#dfe6e9;border-color:#94a3b8}

body.dark{background:radial-gradient(circle at top left,#161926 0%,#111420 42%,#0d1017 100%)}
body.dark .header{background:linear-gradient(135deg,#1c2035 0%,#181c2e 100%);border-color:#2a3050}
body.dark .header h1{color:#e8ecf4}
body.dark .brand-badge{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.3);color:#7cb3f4}
body.dark .hdr-label{color:#8899b2}
body.dark .hdr-input,body.dark .hdr-select,body.dark .search-input{background:#242940;border-color:#333a55;color:#dce3ef}
body.dark .hdr-input::placeholder,body.dark .search-input::placeholder{color:#4a5578}
body.dark .dark-toggle{background:rgba(255,255,255,.08);border-color:#3a4060;color:#cad3e0}
body.dark .chip{background:#1c2035;border-color:#2a3050;color:#b0bdd0}
body.dark .chip.age{color:#a29bfe}body.dark .chip.pct{color:#fab1a0}body.dark .chip.temp{color:#ff7675}body.dark .chip.wt{color:#55efc4}
body.dark .tab{background:#1c2035;border-color:#2d3450;color:#6b7a94}
body.dark .tab:hover{border-color:#4a5580;color:#b0bdd0}
body.dark .tab.active{background:#1c2035;color:#e8ecf4;border-color:#3a4060}
body.dark .panel{background:#1c2035;border-color:#2a3050}
body.dark .dtable th{color:#6b7a94;border-bottom-color:#2a3050}
body.dark .dtable td{border-bottom-color:#232840}
body.dark .dtable tr:hover{background:#242940}
body.dark .drug-name{color:#e8ecf4}
body.dark .drug-note{color:#8b98ad}
body.dark .form-select{background:#242940;border-color:#333a55;color:#dce3ef}
body.dark .dose-val{color:#60a5fa}
body.dark .vol-val{color:#ff7675}
body.dark .freq-val{color:#8b98ad}
body.dark .capped{background:rgba(251,191,36,.08)}
body.dark .age-warn{background:linear-gradient(135deg,rgba(239,68,68,.12),rgba(239,68,68,.06))!important}
body.dark .pcm-box{background:linear-gradient(135deg,rgba(251,191,36,.08),rgba(245,158,11,.06));border-color:rgba(251,191,36,.3)}
body.dark .pcm-title{color:#e8ecf4}
body.dark .pcm-option{background:#242940;border-color:#333a55}
body.dark .pcm-option.winner{border-color:#10b981;background:rgba(16,185,129,.08)}
body.dark .pcm-option h4,body.dark .pcm-option .sub,body.dark .toolbar-note{color:#8b98ad}
body.dark .pcm-option .big{color:#e8ecf4}
body.dark .pcm-form label{color:#8899b2}
body.dark .disc{background:linear-gradient(135deg,#1c2035 0%,#181c2e 100%);border-color:#2a3050;color:#8b98ad}
body.dark .btn-clear{background:#242940;border-color:#333a55;color:#c4d0e0}
body.dark .btn-clear:hover{background:#2d3450;border-color:#4a5580}
body.dark .chart-card,body.dark .date-kind-box{background:#242940;border-color:#333a55}
body.dark .result-card{background:#1c2035;border-color:#333a55;color:#e8ecf4}
body.dark .icon-btn{background:#242940;border-color:#333a55;color:#dce3ef}
body.dark .icon-btn.active{background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff}

@media(max-width:760px){
    html,body{font-size:13px}
    body{padding:12px}
    .container{max-width:100%}
    .header{padding:14px 16px}
    .header h1{font-size:20px}
    .pcm-grid{grid-template-columns:1fr}
    .header-top{flex-direction:column;align-items:flex-start}
    .tab{padding:8px 11px;font-size:11px}
    .dtable td{padding:8px 6px;font-size:13px}
    .drug-name{font-size:13px}
    .dose-val,.vol-val{font-size:13px}
    .freq-val{font-size:12px}
    .form-select{max-width:180px;font-size:12px}
    .hdr-input{font-size:13px;padding:8px 8px;width:64px}
    .hdr-select{font-size:13px;padding:8px 8px}
    .pcm-option .big{font-size:14px}
    .chart-box{height:360px}
}
</style>
</head>
<body>
<div class="container">

<div class="header">
    <div class="brand-badge">Dr. Ray Leung Limited</div>
    <div class="header-top">
        <h1><span>🧒</span>Paed Drug Calculator</h1>
        <div class="header-right">
            <button class="dark-toggle" id="darkToggle" title="Toggle dark mode">🌙</button>
        </div>
    </div>
    <div class="header-right" style="margin-top:12px">
        <span class="hdr-label">Wt</span><input type="number" id="wt" class="hdr-input" placeholder="kg" step="0.1" min="0.5" max="150">
        <span class="hdr-label">DOB / Date</span>
        <input type="number" id="dob-y" class="hdr-input" placeholder="YYYY" style="width:120px">
        <input type="number" id="dob-m" class="hdr-input" placeholder="MM" style="width:60px">
        <input type="number" id="dob-d" class="hdr-input" placeholder="DD" style="width:60px">
        <select id="gender" class="hdr-select"><option value="M">♂</option><option value="F">♀</option></select>
        <span class="hdr-label">°F</span><input type="number" id="temp-f" class="hdr-input" placeholder="°F" step="0.1">
        <button class="btn-clear" onclick="clearAll()">Clear</button>
    </div>
</div>

<div class="info-bar" id="infoBar"></div>
<div class="tabs" id="tabBar"></div>
<div class="panel" id="mainPanel"></div>

<div class="disc">
⚠️ <strong>Disclaimer:</strong> For clinical reference only. Doses are general references. Adjust for indication, severity, renal/hepatic function, allergy, interactions, local formulary, and latest paediatric guidance.
</div>
</div>

<script>
// ============ Dark Mode ============
const DARK_KEY_PAED='paedCalc_dark';
function loadDarkMode(){try{if(localStorage.getItem(DARK_KEY_PAED)==='true')applyDark(true)}catch(e){}}
function toggleDark(){const on=document.body.classList.contains('dark');applyDark(!on)}
function applyDark(on){document.body.classList.toggle('dark',on);document.getElementById('darkToggle').textContent=on?'☀️':'🌙';try{localStorage.setItem(DARK_KEY_PAED,on?'true':'false')}catch(e){}}
document.getElementById('darkToggle').addEventListener('click',toggleDark);
loadDarkMode();

// ============ DOB Paste Parser ============
function parseDOB(str){
    str=str.trim().replace(/[\/]/g,'-');
    const months={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
    let m=str.match(/^(\d{1,2})[-\s]?([A-Z]{3})[-\s]?(\d{4})$/i);
    if(m)return{d:parseInt(m[1]),m:months[m[2].toUpperCase()],y:parseInt(m[3])};
    m=str.match(/^(\d{4})[-](\d{1,2})[-](\d{1,2})$/);
    if(m)return{y:parseInt(m[1]),m:parseInt(m[2]),d:parseInt(m[3])};
    m=str.match(/^(\d{1,2})[-](\d{1,2})[-](\d{4})$/);
    if(m)return{d:parseInt(m[1]),m:parseInt(m[2]),y:parseInt(m[3])};
    return null;
}
['dob-y','dob-m','dob-d'].forEach(id=>{
    document.getElementById(id).addEventListener('paste',function(e){
        const pasted=(e.clipboardData||window.clipboardData).getData('text');
        const result=parseDOB(pasted);
        if(result&&result.y&&result.m&&result.d){
            e.preventDefault();
            document.getElementById('dob-y').value=result.y;
            document.getElementById('dob-m').value=result.m;
            document.getElementById('dob-d').value=result.d;
            onInput();
        }
    });
});

// ============ Utility ============
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function floorHalf(v){return Math.floor(v*2)/2}
function roundHalf(v){return Math.round(v*2)/2}
function ceilHalf(v){return Math.ceil(v*2)/2}
function fmtNum(v){
    if(v===null||v===undefined||isNaN(v))return '—';
    return Math.abs(v%1)<0.001?v.toFixed(0):(+v.toFixed(1)).toString();
}
function fmtRange(a,b,unit){
    if(a===null||b===null||isNaN(a)||isNaN(b))return '—';
    if(Math.abs(a-b)<0.001)return `${fmtNum(a)}${unit?` ${unit}`:''}`;
    return `${fmtNum(a)}–${fmtNum(b)}${unit?` ${unit}`:''}`;
}
function getWt(){return parseFloat(document.getElementById('wt').value)||0}
function getAgeMo(){
    const y=parseInt(document.getElementById('dob-y').value),m=parseInt(document.getElementById('dob-m').value),d=parseInt(document.getElementById('dob-d').value);
    if(!y||!m||!d)return null;
    const dob=new Date(y,m-1,d),now=new Date();
    if(dob>now)return null;
    let mo=(now.getFullYear()-dob.getFullYear())*12+(now.getMonth()-dob.getMonth());
    if(now.getDate()<dob.getDate())mo--;
    return Math.max(0,mo);
}
function getHeaderDate(){
    const y=parseInt(document.getElementById('dob-y').value),m=parseInt(document.getElementById('dob-m').value),d=parseInt(document.getElementById('dob-d').value);
    if(!y||!m||!d)return null;
    const dt=new Date(y,m-1,d);
    if(isNaN(dt.getTime()))return null;
    return dt;
}
function daysBetween(a,b){return Math.round((b-a)/86400000)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function fmtDate(d){if(!d||isNaN(d.getTime()))return '—';return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}

function parseMinAgeMo(note){
    if(!note) return 0;
    const m=note.match(/≥(\d+)(w|m|y)/);
    if(!m) return 0;
    const v=parseInt(m[1]),u=m[2];
    if(u==='w') return v/4.33;
    if(u==='m') return v;
    if(u==='y') return v*12;
    return 0;
}
function isBelowMinAge(note, ageMo){
    if(ageMo===null) return false;
    const min=parseMinAgeMo(note);
    if(min===0) return false;
    return ageMo < min;
}

// ============ Growth Chart Data ============
const GROWTH_PCTS=[2,9,25,50,75,91,98];
const GROWTH_ROWS=[
[0,[2.52,2.70,2.89,3.10,3.31,3.54,3.78],[2.47,2.65,2.84,3.04,3.25,3.47,3.70],[2.56,2.74,2.94,3.15,3.37,3.60,3.85]],
[1,[3.37,3.61,3.87,4.15,4.43,4.74,5.07],[3.25,3.49,3.74,4.01,4.28,4.58,4.89],[3.48,3.73,3.99,4.28,4.58,4.90,5.25]],

function interpGrowth(ageMo, gender){
    const idx=gender==='F'?2:gender==='M'?3:1;
    if(ageMo<=GROWTH_ROWS[0][0]) return GROWTH_ROWS[0][idx];
    if(ageMo>=GROWTH_ROWS[GROWTH_ROWS.length-1][0]) return GROWTH_ROWS[GROWTH_ROWS.length-1][idx];
    for(let i=0;i<GROWTH_ROWS.length-1;i++){
        const a=GROWTH_ROWS[i],b=GROWTH_ROWS[i+1];
        if(ageMo>=a[0]&&ageMo<=b[0]){
            const t=(ageMo-a[0])/(b[0]-a[0]);
            return a[idx].map((v,j)=>v+t*(b[idx][j]-v));
        }
    }
    return null;
}
function estimatePctFromTable(wt,ageMo,gender){
    const vals=interpGrowth(ageMo,gender);
    if(!vals||!wt)return null;
    if(wt<=vals[0])return '<2';
    if(wt>=vals[vals.length-1])return '>98';
    for(let i=0;i<vals.length-1;i++){
        if(wt>=vals[i]&&wt<=vals[i+1]){
            const t=(wt-vals[i])/(vals[i+1]-vals[i]);
            return Math.round((GROWTH_PCTS[i]+t*(GROWTH_PCTS[i+1]-GROWTH_PCTS[i]))*10)/10;
        }
    }
    return null;
}

// ============ Rounding ============
function dispenseSyrRange(targetMg,concPerMl,minMg,maxMg){
    const rawVol=targetMg/concPerMl;
    const candidates=[roundHalf(rawVol),floorHalf(rawVol),ceilHalf(rawVol),roundHalf(rawVol)-0.5,roundHalf(rawVol)+0.5]
        .filter(v=>v>=0.5)
        .filter((v,i,a)=>a.indexOf(v)===i)
        .sort((a,b)=>Math.abs(a-rawVol)-Math.abs(b-rawVol));
    for(const vol of candidates){
        const mg=Math.round(vol*concPerMl*10)/10;
        if(mg>=minMg-0.01&&mg<=maxMg+0.01)return{mg,vol,ok:true};
    }
    const vol=Math.max(0.5,floorHalf(rawVol));
    const mg=Math.round(vol*concPerMl*10)/10;
    return{mg,vol,ok:false};
}
function roundUnit(rawMg,strength,allowedFractions){
    let best=null;
    allowedFractions.forEach(fr=>{
        for(let n=fr;n<=20;n+=fr){
            const actual=n*strength;
            const diff=Math.abs(actual-rawMg);
            if(!best||diff<best.diff)best={n,mg:actual,diff};
        }
    });
    if(!best)return{n:0,mg:0,ok:false};
    return{n:best.n,mg:Math.round(best.mg*10)/10,ok:true};
}
function unitLabel(n,type){
    const noun=type==='cap'?'cap':type==='supp'?'supp':type==='sachet'?'sachet':'tab';
    return fmtNum(n)+' '+noun+(n!==1?'s':'');
}

// ============ Custom Logic ============
function calcCustom(key,wt,ageMo,formIdx,drug){
    switch(key){
        case 'amoxicillinRange':return calcAmoxicillinRange(drug,wt,formIdx);
        case 'tamiflu':{let d=wt<=15?30:wt<=23?45:wt<=40?60:75;return{mg:d};}
        case 'xofluza':{let d=wt<80?40:80;return{mg:d,display:d+' mg ('+Math.round(d/40)+' tab)',noVol:true};}
        case 'montelukast':{let d=4;if(ageMo!==null){d=ageMo<72?4:ageMo<180?5:10;}else{d=wt<20?4:wt<40?5:10;}return{mg:d,display:d+' mg chew/tab',noVol:true};}
        case 'cetirizine':{let d=10;if(ageMo!==null){d=ageMo<24?2.5:ageMo<72?5:10;}else{d=wt<12?2.5:wt<20?5:10;}return{mg:d};}
        case 'loratadine':{let d=10;if(ageMo!==null){d=ageMo<72?5:10;}else{d=wt<30?5:10;}return{mg:d};}
        case 'fexofenadine':{if(formIdx===0)return{mg:30};if(formIdx===2)return{mg:180};return{mg:120};}
        case 'levocetirizine':{let d=5;if(ageMo!==null){d=ageMo<72?1.25:ageMo<144?2.5:5;}else{d=wt<20?1.25:wt<30?2.5:5;}return{mg:d};}
        case 'bilastine':{let d=(ageMo!==null&&ageMo>=144)?20:10;return{mg:d,display:d+' mg tab',noVol:true};}
        case 'desloratadine':{let d=5;if(ageMo!==null){d=ageMo<=72?1.25:ageMo<=144?2.5:5;}else{d=wt<=15?1.25:wt<=30?2.5:5;}return{mg:d};}
        case 'acetylcysteine':{if(formIdx===2)return{mg:600};let d=200;if(ageMo!==null){d=ageMo<24?100:200;}else{d=wt<12?100:200;}return{mg:d};}
        case 'carbocisteine':{let ml=10;if(ageMo!==null){ml=ageMo<60?2.5:ageMo<144?5:10;}else{ml=wt<18?2.5:wt<30?5:10;}return{mg:0,display:ml+' ml',noVol:true};}
        case 'actifed':{
            if(formIdx===1){let tabs=((ageMo!==null&&ageMo>=144)||wt>=30)?1:0.5;return{mg:0,display:tabs+' tab'+(tabs>1?'s':''),noVol:true};}
            let ml=5;if(ageMo!==null){ml=ageMo<24?1.25:ageMo<72?2.5:ageMo<144?5:10;}else{ml=wt<12?1.25:wt<20?2.5:wt<30?5:10;}
            ml=roundHalf(ml);if(ml<0.5)ml=0.5;return{mg:0,display:ml+' ml',noVol:true};
        }
        case 'lactulose':{let d=15;if(ageMo!==null){d=ageMo<12?2.5:ageMo<60?5:ageMo<120?10:15;}else{d=wt<10?2.5:wt<18?5:wt<30?10:15;}return{mg:0,display:d+' ml',noVol:true};}
        case 'macrogol':{let s=2;if(ageMo!==null){s=ageMo<72?1:ageMo<144?2:2;}else{s=wt<20?1:2;}return{mg:0,display:s+' sachet'+(s>1?'s':'')+'/day',noVol:true};}
        case 'smecta':{let s=3;if(ageMo!==null){s=ageMo<12?1:ageMo<24?1.5:3;}else{s=wt<10?1:wt<12?1.5:3;}return{mg:0,display:s+' sachet'+(s>1?'s':'')+'/day',noVol:true};}
        case 'augmentin':return calcAugmentin(drug,wt,formIdx);
    }
    return null;
}

// ============ Paracetamol ============
let pcmFormIdx=1;
const PCM_FORMS=[
    {l:'Syr 125mg/5ml',c:25,t:'syr'},
    {l:'Syr 250mg/5ml',c:50,t:'syr'},
    {l:'Chew Tab 120mg',c:120,t:'tab'},
    {l:'Tab 500mg',c:500,t:'tab'},
    {l:'Supp 125mg',c:125,t:'supp'},
    {l:'Supp 250mg',c:250,t:'supp'}
];

function calcPCM(wt){
    if(!wt)return null;
    const form=PCM_FORMS[pcmFormIdx]||PCM_FORMS[0];
    const minPer=10*wt,targetPer=12.5*wt,maxPer=15*wt,dailyMax=Math.min(75*wt,4000),adultSingleMax=1000;
    const finalMaxPer=Math.min(maxPer,adultSingleMax,dailyMax/4);
    const finalTarget=Math.min(targetPer,finalMaxPer);
    function dispensePCM(f){
        if(f.t==='syr'){const d=dispenseSyrRange(finalTarget,f.c,minPer,finalMaxPer);return{mg:d.mg,vol:d.vol+' ml',ok:d.ok};}
        if(f.t==='tab'){const r=roundUnit(finalTarget,f.c,[0.5,1]);const ok=r.mg>=minPer-0.01&&r.mg<=finalMaxPer+0.01;return{mg:r.mg,vol:unitLabel(r.n,'tab'),ok};}
        if(f.t==='supp'){const n=Math.max(1,Math.round(finalTarget/f.c));const mg=n*f.c;const ok=mg>=minPer-0.01&&mg<=finalMaxPer+0.01;return{mg,vol:unitLabel(n,'supp'),ok};}
        return{mg:finalTarget,vol:'',ok:true};
    }
    const d=dispensePCM(form);
    const maxDoses=Math.floor(dailyMax/d.mg);
    const safeFreq='Q4H PRN';
    return{minPer,maxPer:finalMaxPer,target:finalTarget,dailyMax,dose:d.mg,vol:d.vol,ok:d.ok,safeFreq,maxDoses,form};
}

// ============ Amoxicillin / Augmentin Range Logic ============
function augmentinTargetRange(){
    return{min:45,max:90,label:'45–90 mg/kg/day'};
}

function freqDosesPerDay(freq){
    if((freq||'').includes('BD'))return 2;
    if((freq||'').includes('TDS'))return 3;
    if((freq||'').includes('QID'))return 4;
    if((freq||'').includes('DAILY'))return 1;
    return 1;
}

function calcAmoxicillinRange(drug,wt,formIdx){
    const form=drug.forms[formIdx]||drug.forms[0];
    const freq=form.freqOverride||drug.freq||'TDS';

    if(!wt)return{dose:'—',vol:'—',freq,capped:false,extra:''};

    const doses=freqDosesPerDay(freq);
    const minPerDose=(45*wt)/doses;
    const rawMaxPerDose=(90*wt)/doses;
    const maxPerDose=Math.min(rawMaxPerDose,drug.maxD||1000);
    const capped=rawMaxPerDose>(drug.maxD||1000);
    const practicalMin=Math.min(minPerDose,maxPerDose);

    if(form.t==='syr'){
        let volMin=ceilHalf(practicalMin/form.c);
        let volMax=floorHalf(maxPerDose/form.c);

        if(volMin<0.5)volMin=0.5;

        if(volMax<volMin){
            let vol=floorHalf(maxPerDose/form.c);
            if(vol<0.5)vol=0.5;
            const mg=vol*form.c;
            return{
                dose:fmtNum(mg)+' mg',
                vol:fmtNum(vol)+' ml',
                freq,
                capped:true,
                extra:''
            };
        }

        const mgMin=volMin*form.c;
        const mgMax=volMax*form.c;

        return{
            dose:fmtRange(mgMin,mgMax,'mg'),
            vol:fmtRange(volMin,volMax,'ml'),
            freq,
            capped,
            extra:''
        };
    }

    if(form.t==='tab'||form.t==='cap'){
        let unitMin=Math.ceil((practicalMin/form.c)*2)/2;
        let unitMax=Math.floor((maxPerDose/form.c)*2)/2;

        if(unitMin<0.5)unitMin=0.5;

        if(unitMax<unitMin){
            const r=roundUnit(maxPerDose,form.c,[0.5,1]);
            const n=Math.max(0.5,r.n);
            return{
                dose:fmtNum(n*form.c)+' mg',
                vol:unitLabel(n,form.t),
                freq,
                capped:true,
                extra:''
            };
        }

        const mgMin=unitMin*form.c;
        const mgMax=unitMax*form.c;
        const unitText=unitMin===unitMax
            ? unitLabel(unitMin,form.t)
            : `${fmtNum(unitMin)}–${fmtNum(unitMax)} ${form.t==='cap'?'caps':'tabs'}`;

        return{
            dose:fmtRange(mgMin,mgMax,'mg'),
            vol:unitText,
            freq,
            capped,
            extra:''
        };
    }

    return{dose:'—',vol:'—',freq,capped:false,extra:''};
}

function calcAugmentin(drug,wt,formIdx){
    if(!wt)return{dose:'—',vol:'—',freq:'—',capped:false,extra:''};

    const form=drug.forms[formIdx]||drug.forms[0];
    const freq=form.freqOverride||drug.freq||'BD';
    const doses=freqDosesPerDay(freq);
    const target=augmentinTargetRange();

    const clavLimitKgDay=10;
    const amoxTargetMinDay=target.min*wt;
    const amoxTargetMaxDay=target.max*wt;

    if(form.t==='syr'){
        const amoxPerMl=form.amox5/5;
        const clavPerMl=form.clav5/5;

        const volByAmoxMin=amoxTargetMinDay/(amoxPerMl*doses);
        const volByAmoxMax=amoxTargetMaxDay/(amoxPerMl*doses);
        const volByClavMax=(clavLimitKgDay*wt)/(clavPerMl*doses);

        let volMin=ceilHalf(volByAmoxMin);
        let volMax=floorHalf(Math.min(volByAmoxMax,volByClavMax));

        if(volMin<0.5)volMin=0.5;

        const hasRange=volMax>=volMin && volMax>=0.5;

        if(!hasRange){
            return{
                dose:'No safe range',
                vol:'—',
                freq,
                capped:true,
                extra:''
            };
        }

        const amoxMin=volMin*amoxPerMl;
        const amoxMax=volMax*amoxPerMl;

        return{
            dose:fmtRange(amoxMin,amoxMax,'mg'),
            vol:fmtRange(volMin,volMax,'ml'),
            freq,
            capped:false,
            extra:''
        };
    }

    if(form.t==='tab'){
        const amoxPerTab=form.amox;
        const clavPerTab=form.clav;

        const tabByAmoxMin=amoxTargetMinDay/(amoxPerTab*doses);
        const tabByAmoxMax=amoxTargetMaxDay/(amoxPerTab*doses);
        const tabByClavMax=(clavLimitKgDay*wt)/(clavPerTab*doses);

        let tabMin=Math.ceil(tabByAmoxMin*2)/2;
        let tabMax=Math.floor(Math.min(tabByAmoxMax,tabByClavMax)*2)/2;

        if(tabMin<0.5)tabMin=0.5;

        const hasRange=tabMax>=tabMin && tabMax>=0.5;

        if(!hasRange){
            return{
                dose:'No safe range',
                vol:'—',
                freq,
                capped:true,
                extra:''
            };
        }

        const amoxMin=tabMin*amoxPerTab;
        const amoxMax=tabMax*amoxPerTab;
        const tabText=tabMin===tabMax?unitLabel(tabMin,'tab'):`${fmtNum(tabMin)}–${fmtNum(tabMax)} tabs`;

        return{
            dose:fmtRange(amoxMin,amoxMax,'mg'),
            vol:tabText,
            freq,
            capped:false,
            extra:''
        };
    }

    return{dose:'—',vol:'—',freq,capped:false,extra:''};
}

// ============ Normal Drug Calc ============
function calcDrug(drug,wt,ageMo,formIdx){
    if(!wt)return{dose:'—',vol:'—',freq:drug.freq||'—',capped:false,extra:''};
    const form=drug.forms[formIdx]||drug.forms[0];
    const freq=form.freqOverride||drug.freq;

    if(drug.custom){
        const c=calcCustom(drug.custom,wt,ageMo,formIdx,drug);
        if(!c)return{dose:'—',vol:'—',freq,capped:false,extra:''};
        if(c.dose)return c;
        if(c.noVol)return{dose:c.display||c.mg+' mg',vol:'—',freq:c.freqOverride||freq,capped:false,extra:''};
        let mg=c.mg,vol='';
        if(form.t==='syr'){const d=dispenseSyrRange(mg,form.c,mg*0.85,mg*1.15);mg=d.mg;vol=d.vol+' ml';}
        else if(form.t==='tab'||form.t==='cap'){const r=roundUnit(mg,form.c,[0.5,1]);mg=r.mg;vol=unitLabel(r.n,form.t);}
        else if(form.t==='sachet'){const r=roundUnit(mg,form.c,[1]);mg=r.mg;vol=unitLabel(r.n,'sachet');}
        return{dose:fmtNum(mg)+(drug.unit==='mcg'?' mcg':' mg'),vol,freq,capped:false,extra:''};
    }

    let rawMg=drug.dose*wt;
    let capped=rawMg>drug.maxD;
    let mg=Math.min(rawMg,drug.maxD);
    let vol='';
    const u=drug.unit||'mg';

    if(form.t==='syr'){
        if(u==='ml'){
            let rawVol=mg;
            let roundedVol=roundHalf(rawVol);
            if(roundedVol<0.5&&rawVol>0)roundedVol=0.5;
            mg=roundedVol;vol=roundedVol+' ml';
        }else{
            const d=dispenseSyrRange(mg,form.c,mg*0.85,mg*1.15);
            mg=d.mg;vol=d.vol+' ml';
        }
    }else if(form.t==='tab'||form.t==='cap'){
        const r=roundUnit(mg,form.c,[0.5,1]);
        mg=r.mg;vol=unitLabel(r.n,form.t);
    }else if(form.t==='supp'){
        const r=roundUnit(mg,form.c,[1]);
        mg=r.mg;vol=unitLabel(r.n,'supp');capped=mg>drug.maxD;
    }else if(form.t==='sachet'){
        const r=roundUnit(mg,form.c,[1]);
        mg=r.mg;vol=unitLabel(r.n,'sachet');capped=mg>drug.maxD;
    }

    return{dose:fmtNum(mg)+' '+u,vol,freq,capped,extra:''};
}

function renderInfo(){

// ============ Render Drugs ============
function renderDrugs(panel){
    const wt=getWt(),ageMo=getAgeMo();
    const cats=['All',...Array.from(new Set(DRUGS.map(d=>d.cat)))];
    const catOptions=cats.map(c=>`<option value="${c}"${selectedCat===c?' selected':''}>${c}</option>`).join('');

    let html=`<div class="toolbar">
        <input class="search-input" id="drugSearchInput" placeholder="Search drug..." value="${drugSearch.replace(/"/g,'&quot;')}" oninput="drugSearch=this.value;renderDrugs(document.getElementById('mainPanel'))">
        <select class="hdr-select" onchange="selectedCat=this.value;render()">${catOptions}</select>
    </div>`;

    html+=renderPCM(wt);

    let list=DRUGS.filter(d=>{
        const s=drugSearch.trim().toLowerCase();
        const catOK=selectedCat==='All'||d.cat===selectedCat;
        const searchOK=!s||d.name.toLowerCase().includes(s)||d.cat.toLowerCase().includes(s)||(d.note||'').toLowerCase().includes(s);
        return catOK&&searchOK;
    });

    if(!list.length){
        panel.innerHTML=html+'<p style="color:var(--muted);text-align:center;padding:40px">No matching drugs</p>';
        return;
    }

    html+=`<table class="dtable"><thead><tr><th>Drug</th><th>Formulation</th><th>Per Dose</th><th>Volume / Amount</th><th>Frequency</th></tr></thead><tbody>`;

    list.forEach(drug=>{
        const globalIdx=DRUGS.indexOf(drug);
        const key='drug_'+globalIdx;
        const fi=formSelections[key]||0;
        const r=calcDrug(drug,wt,ageMo,fi);
        const ageWarn=isBelowMinAge(drug.note,ageMo);
        const isNoSafe=(r.dose||'').toString().includes('No safe range');

        let rowClass='';
        if(r.capped)rowClass='capped';
        if(ageWarn)rowClass='age-warn';

        let formOpts=drug.forms.map((f,i)=>`<option value="${i}"${i===fi?' selected':''}>${f.l}</option>`).join('');
        let formHtml=drug.forms.length>1?`<select class="form-select" onchange="formSelections['${key}']=parseInt(this.value);render()">${formOpts}</select>`:`<span style="font-size:13px;color:var(--muted)">${drug.forms[0].l}</span>`;

        html+=`<tr${rowClass?' class="'+rowClass+'"':''}>
            <td><div class="drug-name">${drug.name}${ageWarn?'<span class="age-badge">⚠ AGE</span>':''}</div><div class="drug-note">${drug.cat}${drug.note?' · '+drug.note:''}</div></td>
            <td>${formHtml}</td>
            <td class="dose-val">${r.dose}${r.capped&&!isNoSafe?'<span class="max-badge">CHECK</span>':''}${r.extra||''}</td>
            <td class="vol-val">${r.vol}</td>
            <td class="freq-val">${r.freq}</td>
        </tr>`;
    });

    html+=`</tbody></table>`;
    panel.innerHTML=html;
}

function renderPCM(wt){
    const pcm=calcPCM(wt);
    let formOpts=PCM_FORMS.map((f,i)=>`<option value="${i}"${i===pcmFormIdx?' selected':''}>${f.l}</option>`).join('');
    if(!pcm){
        return `<div class="pcm-box">
            <div class="pcm-title">Paracetamol (Panadol)</div>
            <div class="pcm-form"><label>Formulation:</label><select class="form-select" onchange="pcmFormIdx=parseInt(this.value);render()">${formOpts}</select></div>
        </div>`;
    }
    const doseKg=pcm.dose/getWt();
    return `<div class="pcm-box">
        <div class="pcm-title">Paracetamol (Panadol)</div>
        <div class="pcm-grid">
            <div class="pcm-option">
                <h4>Per dose</h4>
                <div class="big">${fmtNum(pcm.dose)} mg (${fmtNum(doseKg)} mg/kg)</div>
                <div class="sub">${pcm.vol} per dose · Q4H PRN</div>
            </div>
            <div class="pcm-option">
                <h4>Maximum</h4>
                <div class="big">${fmtNum(pcm.dailyMax)} mg/day</div>
                <div class="sub">${fmtNum(pcm.minPer)}–${fmtNum(pcm.maxPer)} mg/dose</div>
            </div>
        </div>
        ${pcm.ok?'':'<div class="warn-line" style="margin-top:10px">Rounded dose is outside 10–15 mg/kg/dose range. Consider another formulation.</div>'}
        <div class="pcm-form">
            <label>Formulation:</label>
            <select class="form-select" onchange="pcmFormIdx=parseInt(this.value);render()">${formOpts}</select>
            <span style="font-size:12px;color:var(--muted)">No quarter tablets · syrup rounded to 0.5 ml and checked against range</span>
        </div>
    </div>`;
}

// ============ Growth Chart ============
function renderGrowth(panel){
    const wt=getWt(),ageMo=getAgeMo(),gender=document.getElementById('gender').value;
    const pct=wt&&ageMo!==null?estimatePctFromTable(wt,ageMo,gender):null;

    let html=`<div class="chart-wrap">
        <div class="toolbar">
            <select class="hdr-select" onchange="document.getElementById('gender').value=this.value;onInput()">
                <option value="M"${gender==='M'?' selected':''}>Male</option>
                <option value="F"${gender==='F'?' selected':''}>Female</option>
            </select>
            <button class="icon-btn ${growthZoom==='toddler'?'active':''}" onclick="growthZoom='toddler';render()">🔍+ 0–3y</button>
            <button class="icon-btn ${growthZoom==='all'?'active':''}" onclick="growthZoom='all';render()">🔍− 0–18y</button>
            <span class="toolbar-note">Weight-for-age chart. Use zoom for 0–3 years.</span>
        </div>
        <div class="chart-card">
            <div class="chart-box">${buildGrowthSVG(gender,ageMo,wt,growthZoom)}</div>
            <div class="chart-legend">
                ${GROWTH_PCTS.map((p,i)=>`<span class="legend-item"><span class="legend-line" style="background:${chartColor(i)}"></span>P${p}</span>`).join('')}
                ${wt&&ageMo!==null?'<span class="legend-item"><span class="legend-line" style="background:#ef4444"></span>Patient</span>':''}
            </div>
        </div>
        <div class="result-card">
            <strong>Patient:</strong> ${wt?wt+' kg':'—'} ·
            <strong>Age:</strong> ${ageMo!==null?Math.floor(ageMo/12)+'y '+Math.round(ageMo%12)+'m':'—'} ·
            <strong>Sex:</strong> ${gender==='M'?'Male':'Female'} ·
            <strong>Estimated weight percentile:</strong> ${pct!==null?'P'+pct:'—'}
        </div>
    </div>`;
    panel.innerHTML=html;
}
function chartColor(i){return['#94a3b8','#64748b','#38bdf8','#2563eb','#22c55e','#f59e0b','#ef4444'][i]||'#333'}
function buildGrowthSVG(gender,ageMo,wt,zoomMode='all'){
    const idx=gender==='F'?2:3;
    const rows=GROWTH_ROWS;
    const minX=0,maxX=zoomMode==='toddler'?36:216;
    let minY=zoomMode==='toddler'?2:2;
    let maxY=zoomMode==='toddler'?20:95;
    if(wt&&ageMo!==null&&ageMo<=maxX)maxY=Math.max(maxY,Math.ceil(wt/5)*5+5);

    const W=1000,H=420,padL=58,padR=20,padT=18,padB=48;
    const x=a=>padL+(a-minX)/(maxX-minX)*(W-padL-padR);
    const y=v=>padT+(maxY-v)/(maxY-minY)*(H-padT-padB);

    let svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Growth chart">`;
    svg+=`<rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>`;

    const yearStep=zoomMode==='toddler'?0.5:2;
    for(let yr=0;yr<=maxX/12;yr+=yearStep){
        const xx=x(yr*12);
        svg+=`<line x1="${xx}" y1="${padT}" x2="${xx}" y2="${H-padB}" stroke="rgba(148,163,184,.35)" stroke-width="1"/>`;
        svg+=`<text x="${xx}" y="${H-20}" text-anchor="middle" font-size="12" fill="#64748b">${yr%1===0?yr:yr.toFixed(1)}</text>`;
    }
    const kgStep=zoomMode==='toddler'?2:10;
    for(let kg=0;kg<=maxY;kg+=kgStep){
        const yy=y(kg);
        svg+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="rgba(148,163,184,.35)" stroke-width="1"/>`;
        svg+=`<text x="${padL-10}" y="${yy+4}" text-anchor="end" font-size="12" fill="#64748b">${kg}</text>`;
    }

    svg+=`<text x="${W/2}" y="${H-4}" text-anchor="middle" font-size="13" fill="#64748b">Age (years)</text>`;
    svg+=`<text x="16" y="${H/2}" text-anchor="middle" font-size="13" fill="#64748b" transform="rotate(-90 16 ${H/2})">Weight (kg)</text>`;

    GROWTH_PCTS.forEach((p,j)=>{
        const visible=rows.filter(r=>r[0]>=minX&&r[0]<=maxX);
        const pts=visible.map(r=>`${x(r[0])},${y(r[idx][j])}`).join(' ');
        svg+=`<polyline points="${pts}" fill="none" stroke="${chartColor(j)}" stroke-width="${p===50?3:2}" stroke-linecap="round" stroke-linejoin="round"/>`;
        const last=visible[visible.length-1];
        svg+=`<text x="${x(last[0])-4}" y="${y(last[idx][j])-4}" text-anchor="end" font-size="11" fill="${chartColor(j)}" font-weight="800">P${p}</text>`;
    });

    if(wt&&ageMo!==null&&ageMo>=minX&&ageMo<=maxX){
        svg+=`<line x1="${x(ageMo)}" y1="${padT}" x2="${x(ageMo)}" y2="${H-padB}" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 5"/>`;
        svg+=`<circle cx="${x(ageMo)}" cy="${y(wt)}" r="7" fill="#ef4444" stroke="#fff" stroke-width="3"/>`;
        svg+=`<text x="${x(ageMo)+10}" y="${y(wt)-10}" font-size="13" fill="#ef4444" font-weight="900">${wt} kg</text>`;
    }

    svg+=`</svg>`;
    return svg;
}

// ============ Pregnancy Wheel ============
function renderPregWheel(panel){
    const baseDate=getHeaderDate();
    let html=`<div class="date-kind-box">
        <span class="hdr-label">Header date is</span>
        <select class="hdr-select" onchange="pregnancyDateKind=this.value;render()">
            <option value="DOB"${pregnancyDateKind==='DOB'?' selected':''}>DOB</option>
            <option value="LMP"${pregnancyDateKind==='LMP'?' selected':''}>LMP</option>
            <option value="EDD"${pregnancyDateKind==='EDD'?' selected':''}>EDD</option>
            <option value="SCAN"${pregnancyDateKind==='SCAN'?' selected':''}>Scan Date</option>
        </select>
        <span class="hint">Current header date: <strong>${baseDate?fmtDate(baseDate):'—'}</strong></span>
        ${pregnancyDateKind==='SCAN'
            ? `<span class="hdr-label">GA at scan</span>
               <input type="number" class="hdr-input" placeholder="w" value="${scanGAWeeks}" oninput="scanGAWeeks=this.value;render()" style="width:70px">
               <input type="number" class="hdr-input" placeholder="d" value="${scanGADays}" oninput="scanGADays=this.value;render()" style="width:70px">`
            : ''}
    </div>
    <div class="result-card">${pregResultFromHeaderDate(baseDate,pregnancyDateKind)}</div>
    <div class="disc" style="margin-top:14px">
        Pregnancy wheel uses the DOB / Date fields in the header as the source date. Select whether that date represents DOB, LMP, EDD, or scan date.
        For scan date, enter GA at scan. Standard EDD calculation assumes 280 days from LMP.
    </div>`;
    panel.innerHTML=html;
}
function gaText(days){
    if(days<0)return '—';
    const w=Math.floor(days/7),d=days%7;
    return `${w}w ${d}d`;
}
function trimester(days){
    if(days<0)return '—';
    if(days<14*7)return '1st trimester';
    if(days<28*7)return '2nd trimester';
    return '3rd trimester';
}
function pregResultFromHeaderDate(baseDate,kind){
    if(!baseDate)return `<div class="result-small">Enter date in the header DOB / Date fields first.</div>`;
    const today=new Date();

    if(kind==='DOB'){
        const ageMo=getAgeMo();
        return `<div class="result-big">DOB mode</div>
            <div class="result-small">
                Date is treated as patient DOB.<br>
                Age: <strong>${ageMo!==null?Math.floor(ageMo/12)+'y '+Math.round(ageMo%12)+'m':'—'}</strong><br>
                DOB: <strong>${fmtDate(baseDate)}</strong>
            </div>`;
    }
    if(kind==='LMP'){
        const ga=daysBetween(baseDate,today);
        const edd=addDays(baseDate,280);
        return `<div class="result-big">${gaText(ga)}</div>
            <div class="result-small">
                Input date treated as LMP: <strong>${fmtDate(baseDate)}</strong><br>
                EDD: <strong>${fmtDate(edd)}</strong><br>
                ${trimester(ga)}<br>
                Estimated conception: ${fmtDate(addDays(baseDate,14))}
            </div>`;
    }
    if(kind==='EDD'){
        const edd=baseDate;
        const daysTo=daysBetween(today,edd);
        const ga=280-daysTo;
        const lmp=addDays(edd,-280);
        return `<div class="result-big">${gaText(ga)}</div>
            <div class="result-small">
                Input date treated as EDD: <strong>${fmtDate(edd)}</strong><br>
                Estimated LMP: <strong>${fmtDate(lmp)}</strong><br>
                ${trimester(ga)}<br>
                Days to EDD: ${daysTo}
            </div>`;
    }
    if(kind==='SCAN'){
        const w=parseInt(scanGAWeeks);
        const d=parseInt(scanGADays||'0');
        if(isNaN(w))return `<div class="result-small">Input date treated as scan date. Enter GA at scan.</div>`;
        const gaAtScan=w*7+(isNaN(d)?0:d);
        const adjustedLMP=addDays(baseDate,-gaAtScan);
        const edd=addDays(adjustedLMP,280);
        const gaNow=daysBetween(adjustedLMP,today);
        return `<div class="result-big">${gaText(gaNow)}</div>
            <div class="result-small">
                Input date treated as scan date: <strong>${fmtDate(baseDate)}</strong><br>
                GA at scan: <strong>${w}w ${isNaN(d)?0:d}d</strong><br>
                Adjusted EDD: <strong>${fmtDate(edd)}</strong><br>
                Adjusted LMP: ${fmtDate(adjustedLMP)}<br>
                ${trimester(gaNow)}
            </div>`;
    }
    return `<div class="result-small">Unknown date type.</div>`;
}

// ============ Auto Recommend ============
function autoRecommend(){
    const wt=getWt(),ageMo=getAgeMo();
    if(!wt)return;

    if(wt>=25)pcmFormIdx=1;
    else pcmFormIdx=0;
    if(ageMo!==null&&ageMo>=72&&wt>=20)pcmFormIdx=3;

    DRUGS.forEach((drug,di)=>{
        if(drug.forms.length<=1)return;
        const key='drug_'+di;

        if(drug.custom==='augmentin'){
            if(ageMo!==null&&ageMo>=144&&wt>=40){
                const t875=drug.forms.findIndex(f=>f.l.includes('875/125'));
                if(t875>=0){formSelections[key]=t875;return;}
            }
            const s400=drug.forms.findIndex(f=>f.l.includes('400 mg/5'));
            if(s400>=0){formSelections[key]=s400;return;}
        }

        if(drug.custom==='tamiflu'&&wt){
            const d=wt<=15?30:wt<=23?45:wt<=40?60:75;
            if(ageMo!==null&&ageMo>=12){
                const capIdx=drug.forms.findIndex(f=>f.t==='cap'&&f.c===d);
                if(capIdx>=0){formSelections[key]=capIdx;return;}
                if(d===60){const c30=drug.forms.findIndex(f=>f.t==='cap'&&f.c===30);if(c30>=0){formSelections[key]=c30;return;}}
            }
            formSelections[key]=0;return;
        }

        if(drug.custom==='montelukast'){
            let d=4;
            if(ageMo!==null){d=ageMo<72?4:ageMo<180?5:10;}
            else{d=wt<20?4:wt<40?5:10;}
            const idx=drug.forms.findIndex(f=>f.c===d);
            if(idx>=0)formSelections[key]=idx;
            return;
        }

        if(ageMo!==null&&ageMo>=72&&wt>=20){
            const tabIdx=drug.forms.findIndex(f=>f.t==='tab'||f.t==='cap');
            if(tabIdx>=0){formSelections[key]=tabIdx;return;}
        }

        if(drug.custom)return;

        const dose=(drug.dose||10)*wt;
        let bestIdx=0,bestVol=999;
        drug.forms.forEach((f,i)=>{
            if(f.t==='syr'){
                const vol=dose/f.c;
                if(vol>=0.5&&vol<=15&&vol<bestVol){bestVol=vol;bestIdx=i;}
            }
        });
        formSelections[key]=bestIdx;
    });
}

// ============ Events ============
function clearAll(){
    ['wt','dob-y','dob-m','dob-d','temp-f'].forEach(id=>document.getElementById(id).value='');
    formSelections={};pcmFormIdx=1;render();
    try{localStorage.removeItem('paedCalcFull')}catch(e){}
}
function onInput(){
    autoRecommend();
    render();
    try{
        localStorage.setItem('paedCalcFull',JSON.stringify({
            wt:document.getElementById('wt').value,
            dy:document.getElementById('dob-y').value,
            dm:document.getElementById('dob-m').value,
            dd:document.getElementById('dob-d').value,
            g:document.getElementById('gender').value,
            tf:document.getElementById('temp-f').value
        }));
    }catch(e){}
}
function loadSaved(){
    try{
        const d=JSON.parse(localStorage.getItem('paedCalcFull'));
        if(!d)return;
        if(d.wt)document.getElementById('wt').value=d.wt;
        if(d.dy)document.getElementById('dob-y').value=d.dy;
        if(d.dm)document.getElementById('dob-m').value=d.dm;
        if(d.dd)document.getElementById('dob-d').value=d.dd;
        if(d.g)document.getElementById('gender').value=d.g;
        if(d.tf)document.getElementById('temp-f').value=d.tf;
    }catch(e){}
}
document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',onInput));

loadSaved();
autoRecommend();
render();
</script>
